
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="./styles/auth.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="auth-card">
    <!-- App Branding -->
    <div class="text-center mb-4">
      <div class="brand-icon">
        <i class="bi bi-check2-circle"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">Welcome back!</h3>
      <p class="text-muted small">Organize your tasks and overcome the day.</p>
    </div>

    <!-- Login Form -->
    <form action="#" method="POST" novalidate id="loginForm">
      <!-- Email Field -->
      <div class="mb-3">
        <label for="loginEmail" class="form-label small fw-semibold text-secondary">Email address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required>
        </div>
      </div>

      <!-- Password Field -->
      <div class="mb-4">
        <label for="loginPassword" class="form-label small fw-semibold text-secondary">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
          <button class="btn btn-outline-light border border-start-0 text-secondary" type="button" id="togglePassword">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-yellow w-100 mb-4">
        Log In
      </button>

      <!-- Redirect to Register -->
      <div class="text-center">
        <p class="small text-muted mb-0">
          Don't have an account? 
          <a href="register.html" class="link-yellow ms-1">Sign up here</a>
        </p>
      </div>
    </form>
  </div>

  <!-- Bootstrap 5.3.x JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./scripts/login.js"></script>
  
</body>
</html>
