<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="./styles/auth.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="auth-card">
    <!-- App Branding -->
    <div class="text-center mb-4">
      <div class="brand-icon">
        <i class="bi bi-check2-circle"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">Welcome back!</h3>
      <p class="text-muted small">Organize your tasks and overcome the day.</p>
    </div>

    <!-- Login Form -->
    <form action="#" method="POST" novalidate id="loginForm">
      <!-- Email Field -->
      <div class="mb-3">
        <label for="loginEmail" class="form-label small fw-semibold text-secondary">Email address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required>
        </div>
      </div>

      <!-- Password Field -->
      <div class="mb-4">
        <label for="loginPassword" class="form-label small fw-semibold text-secondary">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
          <button class="btn btn-outline-light border border-start-0 text-secondary" type="button" id="togglePassword">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-yellow w-100 mb-4">
        Log In
      </button>

      <!-- Redirect to Register -->
      <div class="text-center">
        <p class="small text-muted mb-0">
          Don't have an account? 
          <a href="register.html" class="link-yellow ms-1">Sign up here</a>
        </p>
      </div>
    </form>
  </div>

  <!-- Bootstrap 5.3.x JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // Password visibility toggle
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('loginPassword');

    toggleBtn.addEventListener('click', () => {
      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
      toggleBtn.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
    });

    // Local Storage Authentication
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('loginEmail');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const email = emailInput.value.trim().toLowerCase();
      const password = pwdInput.value;

      if (!email || !password) {
        alert('Please fill in both email and password.');
        return;
      }

      // Retrieve registered users from localStorage
      const users = JSON.parse(localStorage.getItem('todo_users')) || [];

      // Find matching user
      const user = users.find(u => u.email === email && u.password === password);

      if (user) {
        // Save current logged-in user session
        localStorage.setItem('todo_current_user', JSON.stringify({
          name: user.name,
          email: user.email
        }));

        alert(`Welcome back, ${user.name || 'User'}!`);
        // window.location.href = 'index.html'; // Redirect to your task dashboard
      } else {
        alert('Invalid email or password. Please try again or create an account.');
      }
    });
  </script>
</body>
</html>
